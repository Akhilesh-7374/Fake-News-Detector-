version: '3.8'

services:
  dashboard:
    build: .
    ports:
      - "8501:8501"
    environment:
      - PIPELINE_PATH=outputs/pipeline.joblib
      - REALTIME_DB=outputs/realtime.db
    volumes:
      - ./outputs:/app/outputs
    command: ["streamlit", "run", "src/company_dashboard.py", "--server.port=8501", "--server.address=0.0.0.0"]

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PIPELINE_PATH=outputs/pipeline.joblib
      - REALTIME_DB=outputs/realtime.db
    volumes:
      - ./outputs:/app/outputs
    command: ["uvicorn", "src.realtime_api:app", "--host", "0.0.0.0", "--port", "8000"]
